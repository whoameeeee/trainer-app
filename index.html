<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json">
<title>Trainer App 3.0</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}header{background:#111827;color:#fff;padding:17px 15px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:21px}header p{margin:3px 0 0;color:#cbd5e1;font-size:12px}
nav{position:sticky;top:69px;z-index:4;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;gap:6px;overflow:auto;padding:9px}nav button{border:0;border-radius:11px;padding:10px 12px;white-space:nowrap;font-weight:750;background:#eef0f4;color:#374151}nav button.active{background:#5b5bd6;color:#fff}
main{max-width:1050px;margin:auto;padding:14px 14px 90px}.screen{display:none}.screen.active{display:block}h2{margin:6px 0 13px;font-size:20px}.muted{color:#6b7280;font-size:12px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:17px;padding:15px;margin:11px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{padding:14px;background:#fff;border:1px solid #e5e7eb;border-radius:15px}.stat b{display:block;font-size:23px}.stat span{font-size:11px;color:#6b7280}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.wrap{flex-wrap:wrap}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}label{display:block;font-size:11px;font-weight:700;color:#6b7280;margin:9px 0 4px}input,select,textarea{width:100%;padding:10px;border:1px solid #d8dde6;border-radius:10px;font:inherit;background:#fff}textarea{min-height:70px}
button{font:inherit;cursor:pointer}.primary{border:0;background:#5b5bd6;color:#fff;border-radius:10px;padding:10px 14px;font-weight:800}.secondary{border:1px solid #e1e4ea;background:#fff;border-radius:10px;padding:9px 12px;font-weight:700}.danger{border:0;background:#fff0f0;color:#c53030;border-radius:9px;padding:8px 11px;font-weight:700}.tag{display:inline-block;background:#eef0ff;color:#4545a8;padding:4px 8px;border-radius:99px;font-size:10px;font-weight:800}.ok{color:#138a42;font-weight:800}.bad{color:#d22f2f;font-weight:800}
.client{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:13px;margin:8px 0}.client h3{margin:0 0 3px}.money{font-size:18px;font-weight:850}.exercise{background:#fafbff;border:1px solid #e5e7eb;border-radius:13px;padding:10px;margin:7px 0}.exgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.tablewrap{overflow:auto}.paytable{width:100%;min-width:650px;border-collapse:collapse}.paytable th,.paytable td{text-align:left;padding:10px;border-bottom:1px solid #e5e7eb;font-size:12px}.paytable th{color:#6b7280}.empty{text-align:center;padding:28px;color:#6b7280}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 15px;border-radius:11px;display:none;z-index:20}
.profile-head{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:8px}.metric{background:#f8f9fc;border-radius:12px;padding:11px}.metric small{display:block;color:#6b7280;font-size:10px}.metric b{font-size:18px}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.formgrid,.profile-head{grid-template-columns:1fr}.exgrid{grid-template-columns:1fr 1fr}.stat b{font-size:20px}}
</style></head>
<body>
<header><h1>🏋️ Trainer App 3.0</h1><p>Клиенты · Программы · Расписание · Оплаты</p></header>
<nav><button class="active" data-s="home">🏠 Сегодня</button><button data-s="clients">👥 Клиенты</button><button data-s="training">➕ Тренировка</button><button data-s="workouts">📋 Тренировки</button><button data-s="payments">💳 Оплаты</button></nav>
<main>
<section id="home" class="screen active"><h2>Сегодня</h2><div class="grid"><div class="stat"><b id="a">0</b><span>тренировок сегодня</span></div><div class="stat"><b id="b">0</b><span>клиентов</span></div><div class="stat"><b id="c">0</b><span>долгов</span></div><div class="stat"><b id="d">0 ₽</b><span>оплачено</span></div></div><div class="card"><div class="row"><b>Ближайшие тренировки</b><button class="secondary" onclick="screen('training')">+ Добавить</button></div><div id="upcoming"></div></div></section>

<section id="clients" class="screen"><h2>Клиенты</h2><div class="card"><div class="formgrid"><div><label>Имя</label><input id="cn" placeholder="Анна"></div><div><label>Телефон</label><input id="cp" placeholder="+7 ..."></div><div><label>Цель / направление</label><input id="goal" placeholder="Pilates, спина..."></div><div><label>Абонемент / заметка</label><input id="cnote" placeholder="Например: 8 занятий"></div></div><button class="primary" style="margin-top:10px" onclick="addClient()">Добавить клиента</button></div><input id="search" placeholder="🔎 Найти клиента..." oninput="renderClients()"><div id="clist"></div></section>

<section id="profile" class="screen"><div class="row"><div><h2 id="pname">Клиент</h2><div id="pinfo" class="muted"></div></div><button class="secondary" onclick="screen('clients')">← Клиенты</button></div><div class="profile-head" id="metrics"></div><div class="card"><b>Личные заметки</b><textarea id="pnotes" onchange="saveProfileNotes()" placeholder="Цели, ограничения, предпочтения..."></textarea></div><div class="card"><div class="row"><b>История тренировок</b><button class="primary" onclick="newForProfile()">+ Тренировка</button></div><div id="phistory"></div></div><div class="card"><b>Оплаты клиента</b><div id="ppayments"></div></div></section>

<section id="training" class="screen"><h2 id="ttitle">Новая тренировка</h2><div class="card"><input type="hidden" id="eid"><div class="formgrid"><div><label>Клиент</label><select id="wc"></select></div><div><label>Тип</label><select id="wt"><option>Персональная</option><option>Pilates</option><option>Силовая</option><option>Растяжка</option><option>Кардио</option><option>Онлайн</option><option>Групповая</option></select></div><div><label>Дата</label><input type="date" id="wd"></div><div><label>Время</label><input type="time" id="wtime" value="10:00"></div><div><label>Длительность</label><input type="number" id="wdur" value="60"></div><div><label>Стоимость, ₽</label><input type="number" id="wprice" value="0"></div></div><label>Упражнения</label><div class="formgrid"><select id="cat" onchange="fillEx()"></select><select id="ex"></select></div><div class="row" style="margin-top:8px"><button class="secondary" onclick="addEx()">＋ Упражнение</button><button class="secondary" onclick="customEx()">＋ Своё</button></div><div id="exlist"></div><label>Заметки тренера</label><textarea id="wn" placeholder="Что учесть..."></textarea><div class="row" style="margin-top:10px"><button class="primary" onclick="saveWorkout()">💾 Сохранить</button><button class="secondary" onclick="clearWorkout()">Очистить</button></div></div></section>

<section id="workouts" class="screen"><h2>Тренировки</h2><div class="card"><select id="wf" onchange="renderWorkouts()"><option value="">Все клиенты</option></select></div><div id="wlist"></div></section>

<section id="payments" class="screen"><h2>Оплаты</h2><div class="card"><div class="row wrap"><b>Общий долг: <span id="debt">0 ₽</span></b><input id="paysearch" placeholder="Поиск клиента..." oninput="renderPayments()" style="max-width:250px"></div></div><div class="tablewrap"><table class="paytable"><thead><tr><th>Клиент</th><th>Дата</th><th>Тренировка</th><th>Сумма</th><th>Статус</th><th></th></tr></thead><tbody id="pbody"></tbody></table></div></section>
</main><div id="toast" class="toast"></div>
<script>
const E={"Спина":["Кошка-корова","Bird Dog","Плавание Pilates","Swan","Повороты позвоночника","Тяга резинки"],"Ноги":["Приседания","Выпады","Ягодичный мост","Clam Shell","Side Leg Lift","Wall Sit"],"Ягодицы":["Ягодичный мост","Мост на одной ноге","Clam Shell","Donkey Kick","Fire Hydrant"],"Пресс":["Hundred","Dead Bug","Roll Up","Criss Cross","Plank","Toe Taps"],"Руки и плечи":["Круги руками","Отжимания от стены","Тяга резинки","Разведение рук","Triceps Kickback"],"Pilates":["Hundred","Roll Up","Single Leg Stretch","Double Leg Stretch","Spine Stretch Forward","Saw","Swan","Swimming"],"Растяжка":["Задняя поверхность бедра","Сгибатели бедра","Поза ребёнка","Растяжка ягодиц","Грудной отдел"],"Дыхание":["Диафрагмальное дыхание","Боковое дыхание Pilates","Релаксация"],"Кардио":["Marching","Step Touch","Jumping Jacks","Высокие колени"]};
let clients=JSON.parse(localStorage.getItem("v3_clients")||"[]"), ws=JSON.parse(localStorage.getItem("v3_workouts")||"[]"), exs=[], currentProfile=null;
const $=x=>document.getElementById(x), id=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random();
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function persist(){localStorage.setItem("v3_clients",JSON.stringify(clients));localStorage.setItem("v3_workouts",JSON.stringify(ws))}
function toast(t){let x=$("toast");x.textContent=t;x.style.display="block";clearTimeout(window.z);window.z=setTimeout(()=>x.style.display="none",2000)}
function screen(s){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(s).classList.add("active");document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x.dataset.s===s));renderAll()}
document.querySelectorAll("nav button").forEach(x=>x.onclick=()=>screen(x.dataset.s));
function client(id){return clients.find(x=>x.id===id)}
function date(d){return d?new Date(d+"T00:00:00").toLocaleDateString("ru-RU"):""}
function addClient(){let n=$("cn").value.trim();if(!n)return toast("Введите имя");clients.push({id:id(),name:n,phone:$("cp").value.trim(),goal:$("goal").value.trim(),note:$("cnote").value.trim(),personalNote:""});["cn","cp","goal","cnote"].forEach(x=>$(x).value="");persist();renderAll();toast("Клиент добавлен")}
function renderClients(){let q=($("search").value||"").toLowerCase(), arr=clients.filter(c=>(c.name+" "+c.phone+" "+c.goal).toLowerCase().includes(q));$("clist").innerHTML=arr.length?arr.map(c=>{let cw=ws.filter(w=>w.clientId===c.id), debt=cw.filter(w=>!w.paid).reduce((s,w)=>s+Number(w.price||0),0);return `<div class="client"><div class="row wrap"><div><h3>${esc(c.name)}</h3><div class="muted">${esc(c.phone||"Телефон не указан")} · ${esc(c.goal||"Цель не указана")}</div></div><div><span class="${debt?'bad':'ok'}">${debt?`Долг ${debt} ₽`:"Оплачено ✓"}</span></div></div><div class="muted" style="margin:8px 0">Тренировок: ${cw.length} · ${c.note?esc(c.note):"без абонемента"}</div><button class="primary" onclick="openProfile('${c.id}')">Открыть карточку клиента</button> <button class="danger" onclick="delClient('${c.id}')">Удалить</button></div>`}).join(""):`<div class="empty">Клиентов пока нет</div>`}
function delClient(i){if(!confirm("Удалить клиента и его тренировки?"))return;clients=clients.filter(c=>c.id!==i);ws=ws.filter(w=>w.clientId!==i);persist();renderAll()}
function openProfile(i){currentProfile=i;screen("profile")}
function renderProfile(){if(!currentProfile||!client(currentProfile))return;let c=client(currentProfile), cw=ws.filter(w=>w.clientId===c.id).sort((a,b)=>(b.date+" "+b.time).localeCompare(a.date+" "+a.time)), paid=cw.filter(w=>w.paid).reduce((s,w)=>s+Number(w.price||0),0), debt=cw.filter(w=>!w.paid).reduce((s,w)=>s+Number(w.price||0),0);$("pname").textContent=c.name;$("pinfo").textContent=(c.phone||"")+(c.goal?" · "+c.goal:"");$("pnotes").value=c.personalNote||"";$("metrics").innerHTML=`<div class="metric"><small>Тренировок</small><b>${cw.length}</b></div><div class="metric"><small>Оплачено</small><b>${paid} ₽</b></div><div class="metric"><small>Долг</small><b class="${debt?'bad':'ok'}">${debt} ₽</b></div><div class="metric"><small>Выполнено</small><b>${cw.filter(w=>w.done).length}</b></div>`;$("phistory").innerHTML=cw.length?cw.map(w=>`<div class="client"><div class="row"><div><b>${date(w.date)} · ${esc(w.time)}</b><br><span class="tag">${esc(w.type)}</span> ${w.exercises?.length||0} упражнений</div><div class="${w.paid?'ok':'bad'}">${w.paid?"Оплачено":"Не оплачено"}</div></div><div style="margin-top:7px">${(w.exercises||[]).map(e=>esc(e.name)).join(" · ")}</div><div class="row" style="margin-top:7px"><span class="muted">${w.price} ₽ ${w.done?"· выполнено":""}</span><button class="secondary" onclick="editW('${w.id}')">Изменить</button></div></div>`).join(""):`<div class="empty">Истории пока нет</div>`;$("ppayments").innerHTML=cw.length?cw.map(w=>`<div class="row" style="padding:8px 0;border-bottom:1px solid #eee"><span>${date(w.date)} · ${esc(w.type)}</span><b class="${w.paid?'ok':'bad'}">${w.price} ₽ · ${w.paid?"Оплачено":"Не оплачено"}</b></div>`).join(""):`<div class="empty">Оплат пока нет</div>`}
function saveProfileNotes(){let c=client(currentProfile);if(c){c.personalNote=$("pnotes").value;persist();toast("Заметки сохранены")}}
function newForProfile(){clearWorkout();$("wc").value=currentProfile;screen("training")}
function fillClients(){let o=clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("");$("wc").innerHTML=o||'<option value="">Добавьте клиента</option>';$("wf").innerHTML='<option value="">Все клиенты</option>'+o}
function fillCat(){ $("cat").innerHTML=Object.keys(E).map(x=>`<option>${x}</option>`).join("");fillEx()}
function fillEx(){let a=E[$("cat").value]||[];$("ex").innerHTML=a.map(x=>`<option>${x}</option>`).join("")}
function addEx(){if(!$("ex").value)return;exs.push({name:$("ex").value,cat:$("cat").value,sets:3,reps:"10",time:"",note:""});renderEx()}
function customEx(){let n=prompt("Название упражнения");if(n?.trim()){exs.push({name:n.trim(),cat:"Моё",sets:3,reps:"10",time:"",note:""});renderEx()}}
function renderEx(){$("exlist").innerHTML=exs.map((e,i)=>`<div class="exercise"><div class="row"><b>${esc(e.name)}</b><button class="danger" onclick="exs.splice(${i},1);renderEx()">Удалить</button></div><div class="exgrid"><div><label>Подходы</label><input value="${esc(e.sets)}" onchange="exs[${i}].sets=this.value"></div><div><label>Повторения</label><input value="${esc(e.reps)}" onchange="exs[${i}].reps=this.value"></div><div><label>Время</label><input value="${esc(e.time)}" placeholder="30 сек" onchange="exs[${i}].time=this.value"></div></div><input style="margin-top:7px" value="${esc(e.note)}" placeholder="Заметка" onchange="exs[${i}].note=this.value"></div>`).join("")}
function clearWorkout(){$("eid").value="";$("ttitle").textContent="Новая тренировка";$("wd").value=new Date().toISOString().slice(0,10);$("wtime").value="10:00";$("wdur").value=60;$("wprice").value=0;$("wn").value="";exs=[];renderEx()}
function saveWorkout(){let cid=$("wc").value;if(!cid)return toast("Выберите клиента");let o={id:$("eid").value||id(),clientId:cid,type:$("wt").value,date:$("wd").value,time:$("wtime").value,duration:+$("wdur").value||60,price:+$("wprice").value||0,notes:$("wn").value,exercises:JSON.parse(JSON.stringify(exs)),paid:false,done:false},ix=ws.findIndex(w=>w.id===o.id);if(ix>=0){o.paid=ws[ix].paid;o.done=ws[ix].done;ws[ix]=o}else ws.push(o);persist();clearWorkout();toast("Сохранено");currentProfile=cid;screen("profile")}
function editW(i){let w=ws.find(x=>x.id===i);$("eid").value=w.id;$("ttitle").textContent="Редактировать тренировку";$("wc").value=w.clientId;$("wt").value=w.type;$("wd").value=w.date;$("wtime").value=w.time;$("wdur").value=w.duration;$("wprice").value=w.price;$("wn").value=w.notes||"";exs=JSON.parse(JSON.stringify(w.exercises||[]));renderEx();screen("training")}
function togglePaid(i){let w=ws.find(x=>x.id===i);w.paid=!w.paid;persist();renderAll();toast(w.paid?"Оплата отмечена":"Оплата отменена")}
function toggleDone(i){let w=ws.find(x=>x.id===i);w.done=!w.done;persist();renderAll()}
function delW(i){if(confirm("Удалить тренировку?")){ws=ws.filter(w=>w.id!==i);persist();renderAll()}}
function renderWorkouts(){let f=$("wf").value,a=ws.filter(w=>!f||w.clientId===f).sort((x,y)=>(y.date+y.time).localeCompare(x.date+x.time));$("wlist").innerHTML=a.length?a.map(w=>`<div class="card"><div class="row wrap"><div><b>${esc(client(w.clientId)?.name||"")}</b><div class="muted">${date(w.date)} · ${esc(w.time)} · ${esc(w.type)} · ${w.price} ₽</div></div><span class="${w.paid?'ok':'bad'}">${w.paid?"✓ Оплачено":"Не оплачено"}</span></div><div style="margin-top:8px">${(w.exercises||[]).map(e=>`<span class="tag">${esc(e.name)}</span> `).join("")}</div><div class="row wrap" style="margin-top:10px"><button class="secondary" onclick="editW('${w.id}')">✏️ Изменить</button><button class="secondary" onclick="toggleDone('${w.id}')">${w.done?"↩":"✓ Выполнено"}</button><button class="secondary" onclick="togglePaid('${w.id}')">💳 ${w.paid?"Отменить":"Оплатить"}</button><button class="danger" onclick="delW('${w.id}')">Удалить</button></div></div>`).join(""):`<div class="empty">Тренировок нет</div>`}
function renderPayments(){let q=($("paysearch").value||"").toLowerCase(),a=ws.filter(w=>(client(w.clientId)?.name||"").toLowerCase().includes(q)),debt=a.filter(w=>!w.paid).reduce((s,w)=>s+Number(w.price||0),0);$("debt").textContent=debt.toLocaleString("ru-RU")+" ₽";$("pbody").innerHTML=a.length?a.map(w=>`<tr><td><b>${esc(client(w.clientId)?.name||"")}</b></td><td>${date(w.date)}</td><td>${esc(w.type)}</td><td>${w.price} ₽</td><td class="${w.paid?'ok':'bad'}">${w.paid?"✓ Оплачено":"❌ Не оплачено"}</td><td><button class="secondary" onclick="togglePaid('${w.id}')">${w.paid?"Отменить":"Отметить"}</button></td></tr>`).join(""):`<tr><td colspan="6" class="empty">Нет данных</td></tr>`}
function renderHome(){let t=new Date().toISOString().slice(0,10),un=ws.filter(w=>!w.paid);$("a").textContent=ws.filter(w=>w.date===t).length;$("b").textContent=clients.length;$("c").textContent=un.length;$("d").textContent=ws.filter(w=>w.paid).reduce((s,w)=>s+Number(w.price||0),0).toLocaleString("ru-RU")+" ₽";let a=ws.filter(w=>(w.date+w.time)>=t).sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time)).slice(0,7);$("upcoming").innerHTML=a.map(w=>`<div class="client"><div class="row"><span><b>${date(w.date)} · ${esc(w.time)}</b><br>${esc(client(w.clientId)?.name||"")} · ${esc(w.type)}</span><span class="${w.paid?'ok':'bad'}">${w.paid?"Оплачено":"Не оплачено"}</span></div></div>`).join("")||'<div class="empty">Нет ближайших тренировок</div>'}
function renderAll(){fillClients();renderClients();renderWorkouts();renderPayments();renderHome();renderProfile()}
fillCat();clearWorkout();renderAll();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
