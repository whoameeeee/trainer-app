<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f3ec"><link rel="manifest" href="manifest.json"><title>Каталог упражнений · Продвижение</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f3ec;color:#493e33;font:15px system-ui,-apple-system,sans-serif}main{max-width:920px;margin:auto;padding:20px 14px 70px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:27px;margin:12px 0 5px}a{color:#52674e;text-decoration:none;font-weight:700}.muted{color:#8a7b6a;font-size:13px}.filters{background:white;border:1px solid #e7ded2;border-radius:19px;padding:14px;margin:18px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select{width:100%;padding:12px;border:1px solid #ded5c8;border-radius:11px;background:#fff;color:#493e33;font-size:15px}.full{grid-column:1/-1}.item{background:white;border:1px solid #e7ded2;border-radius:14px;padding:14px;margin:9px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}.item b{display:block;margin-bottom:4px}.item small{color:#8a7b6a}button{border:0;border-radius:11px;padding:11px 13px;background:#687a5c;color:white;font-weight:700;cursor:pointer;white-space:nowrap}.sub{background:#eee8de;color:#493e33}.sticky{position:sticky;bottom:0;background:#f7f3ec;padding:12px 0;border-top:1px solid #e7ded2;display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{display:inline-block;background:#e8eddf;padding:5px 9px;border-radius:30px;font-size:12px;color:#52674e}@media(max-width:480px){.filters{grid-template-columns:1fr}.full{grid-column:auto}.item{align-items:flex-start}.item button{padding:9px}}</style></head><body><main><header><a href="index.html">← В приложение</a><span class="pill">Продвижение</span></header><h1>Каталог упражнений</h1><p class="muted">Упражнения из таблицы «Упражнения расписаны по целям». Выберите раздел, цель и упражнение.</p><div class="filters"><select id="section" onchange="fill()"><option value="">MAT и ST</option><option>MAT</option><option>ST</option></select><select id="cat" onchange="fillSub()"><option value="">Все цели</option></select><select id="sub" onchange="render()"><option value="">Все направления</option></select><input id="q" class="full" placeholder="Поиск по названию упражнения" oninput="render()"></div><p id="count" class="muted"></p><div id="list"></div><div class="sticky"><span id="chosen" class="muted">Выбрано: 0</span><a href="index.html" class="pill">Перейти к тренировке →</a></div></main><script src="exercises-data.js"></script><script>const $=id=>document.getElementById(id),D=window.PR_EXERCISES||[];function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function uniq(a){return [...new Set(a.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru'))}function options(id,a,first){$(id).innerHTML='<option value="">'+first+'</option>'+a.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('')}function fill(){options('cat',uniq(D.filter(d=>!$('section').value||d.section===$('section').value).map(d=>d.category)),'Все цели');fillSub()}function fillSub(){options('sub',uniq(D.filter(d=>(!$('section').value||d.section===$('section').value)&&(!$('cat').value||d.category===$('cat').value)).map(d=>d.sub)),'Все направления');render()}function chosen(){let a=JSON.parse(localStorage.getItem('pr_ex_selection')||'[]');$('chosen').textContent='Выбрано: '+a.length}function add(i){let a=JSON.parse(localStorage.getItem('pr_ex_selection')||'[]');a.push(D[i]);localStorage.setItem('pr_ex_selection',JSON.stringify(a));chosen();let b=document.getElementById('b'+i);if(b){b.textContent='✓ Добавлено';setTimeout(()=>b.textContent='+ Добавить',1400)}}function render(){let q=$('q').value.toLowerCase(),items=D.map((d,i)=>({...d,i})).filter(d=>(!$('section').value||d.section===$('section').value)&&(!$('cat').value||d.category===$('cat').value)&&(!$('sub').value||d.sub===$('sub').value)&&(!q||[d.name,d.category,d.sub,d.detail].join(' ').toLowerCase().includes(q)));$('count').textContent='Найдено: '+items.length;$('list').innerHTML=items.slice(0,250).map(d=>'<div class="item"><div><b>'+esc(d.name)+'</b><small>'+esc(d.section)+' · '+esc(d.category)+(d.sub?' · '+esc(d.sub):'')+(d.detail?' · '+esc(d.detail):'')+'</small></div><button id="b'+d.i+'" onclick="add('+d.i+')">+ Добавить</button></div>').join('')+(items.length>250?'<p class="muted">Показаны первые 250 результатов. Уточните поиск или категорию.</p>':'');chosen()}fill();</script></body></html>
