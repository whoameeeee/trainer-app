<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Продвижение · Связь клиентов</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f5ef;color:#463c33;font:15px system-ui}main{max-width:720px;margin:auto;padding:20px}section{background:white;border:1px solid #e9e1d6;border-radius:18px;padding:16px;margin:12px 0}select,button{font:inherit;padding:12px;border:1px solid #d8cbbb;border-radius:10px;width:100%;margin:7px 0}button{background:#728065;color:white;border:0}.muted{color:#827568;font-size:13px}.item{padding:12px 0;border-bottom:1px solid #eee}a{color:#596a50}</style></head><body><main><a href="finance.html">← Финансы</a><h1>Связать карточки клиентов</h1><p class="muted">Только для владельца. Выберите существующую карточку и подтверждённый аккаунт клиента. Никакие старые данные не удаляются.</p><p id="msg"></p><section><label>Карточка из расписания<select id="legacy"></select></label><label>Аккаунт клиента<select id="account"></select></label><button id="save">Связать</button></section><section><h2>Уже связаны</h2><div id="links"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const $=id=>document.getElementById(id);let db,u,s,old=[],accounts=[],links=[];const say=x=>$('msg').textContent=x;
async function init(){try{const c=window.SUPABASE_CONFIG;if(!c?.publishableKey||c.publishableKey.includes('PASTE_'))throw Error('Настройте config.js');db=supabase.createClient(c.url,c.publishableKey);let a=await db.auth.getUser();u=a.data.user;if(!u)throw Error('Сначала войдите в приложении.');let r=await db.from('studios').select('id').eq('owner_id',u.id).limit(1);if(r.error)throw r.error;if(!r.data.length)throw Error('Этот раздел доступен только владельцу студии.');s=r.data[0].id;await refresh()}catch(e){say(e.message)}}
async function get(q){let r=await q;if(r.error)throw r.error;return r.data}
async function refresh(){try{[old,accounts,links]=await Promise.all([get(db.from('clients').select('id,name').eq('trainer_id',u.id).order('name')),get(db.from('studio_members').select('user_id').eq('studio_id',s).eq('role','client').eq('approved',true)),get(db.from('studio_client_links').select('legacy_client_id,client_user_id').eq('studio_id',s))]);let linked=new Set(links.map(x=>x.legacy_client_id)),used=new Set(links.map(x=>x.client_user_id));$('legacy').replaceChildren(...old.filter(x=>!linked.has(x.id)).map(x=>new Option(x.name,x.id)));$('account').replaceChildren(...accounts.filter(x=>!used.has(x.user_id)).map(x=>new Option(x.user_id,x.user_id)));$('links').replaceChildren(...links.map(x=>{let d=document.createElement('div');d.className='item';d.textContent=(old.find(c=>c.id===x.legacy_client_id)?.name||x.legacy_client_id)+' → '+x.client_user_id;return d}));if(!links.length)$('links').textContent='Пока нет связей.';say('Связано карточек: '+links.length)}catch(e){say(e.message)}}
$('save').onclick=async()=>{let legacy=$('legacy').value,account=$('account').value;if(!legacy||!account)return say('Выберите карточку и аккаунт.');if(!confirm('Подтвердить связь? Убедитесь, что это один и тот же клиент.'))return;try{await get(db.from('studio_client_links').insert({studio_id:s,legacy_client_id:legacy,client_user_id:account,linked_by:u.id}).select());await refresh()}catch(e){say(e.message)}};init();
</script></body></html>
